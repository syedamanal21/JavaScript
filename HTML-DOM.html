<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Zoo</title>
</head>
<body>
    <h1>My Zoo</h1>
    <p>Use Javascript and the DOM to add animals to each cage!</p>
    <div id="zoo">
        <div class="zone">Zone:1 <span id="zone1"></span></div>
        <div class="zone">Zone:2 <span id="zone2"></span></div>
        <div class="zone">Zone:3 <span id="zone3"></span></div>
        <div id="zone">Total Animals: <span id="total"></span></div>
        </div>
        <button onclick="Openzoo()">Open the Zoo!</button>
        <p id="status"></p>
        <script>
            function Openzoo(){
                document.getElementById("zone1").innerHTML="Lion";
                document.getElementById("zone2").innerHTML="Bear";
                document.getElementById("zone3").innerHTML="Elephant";
                document.getElementById("total").innerHTML="3";
                document.getElementById("zoo").style.backgroundColor="lightgreen";
                document.getElementById("status").innerHTML=document.title +" is now open!";

            }
        </script>
</body>
</html>
