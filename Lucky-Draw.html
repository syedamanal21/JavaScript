<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw</title>
</head>
<body>
    <h1>Lucky Draw</h1>
    <p>Enter your name and Guess a number to win!</p>
    <input type="text" id="name" placeholder="Your Name" required><br>
    <p id="msg-name"></p>
    <input type="number" id="guess" placeholder="guess a number (1 to 5)" min="1" max="5"><br>
    <p id="msg-guess"></p>
    <button onclick="checkform()">Try my Luck!
    </button>
    <p id="result"></p>
    <p id="timer"></p>
    <script>
        var sec=0;
        setInterval(function(){
        sec=sec+1;
        document.getElementById("timer").textContent="You have been here for "+sec+"seconds!"; 
    },1000);
    </script>
</body>
</html>
