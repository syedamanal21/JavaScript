<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript Objects Data Structure and Array</h2>
    <script>
var student = {
    name: 'Syeda Manal',
    age: '16',
    school: 'UPSS',
    Grade: '11',
    hobbies: 'Sketching',
    fav_sport: 'Football'
};
var color = ["white", "pink", "red", "green", "blue"];
document.write("Student name is : " + student.name,
"<br>","Student age is : " +student.age ,"<br>","Student grade is : " +student.Grade ,"<br>","Student hobby is : " +student.hobbies ,"<br>","Student fav_sport is : " +student.fav_sport, "<br>" ,"Student school is : " +student.school ,);
document.write("<br>Before Poping the colors are: " + color.join(","));
document.write("<br>My favorite color is : " + color[1]);
color.pop();
document.write("<br>After Poping the colors are : " + color.join("-"));
</script>
