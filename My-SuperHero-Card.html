<!DOCTYPE html>

<html>
<head>
  <title>My Superhero Power Cards</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e8f8f5;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #16a085;
    }

    p {
      color: #555555;
    }

    button {
      background-color: #16a085;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .hero-card {
      background-color: white;
      border: 3px solid #48c9b0;
      border-radius: 12px;
      width: 220px;
      padding: 18px;
    }

    .hero-name {
      font-size: 22px;
      font-weight: bold;
      color: #117864;
    }

    .hero-power {
      color: #8e44ad;
      font-weight: bold;
    }

    .hero-mission {
      color: #666666;
      font-size: 14px;
    }
  </style>

</head>

<body>

  <h1>My Superhero Power Cards</h1>

  <p>
    Click the button to create superhero objects using JavaScript classes.
  </p>

<button onclick="showHeroes()">Show Superheroes</button>

  <div class="card-container" id="heroCards"></div>

  <script>
    // What is a Class?
    // A class is a blueprint used to create objects.

    class Superhero {

      // Constructor
      constructor(name, power, mission) {

        // The this keyword stores values inside the object
        this.name = name;
        this.power = power;
        this.mission = mission;
      }

      // Class Method
      describeHero() {
        return "<div class='hero-card'>" +
               "<p class='hero-name'>" + this.name + "</p>" +
               "<p class='hero-power'>Power: " + this.power + "</p>" +
               "<p class='hero-mission'>Mission: " + this.mission + "</p>" +
               "</div>";
      }
    }

    function showHeroes() {

      // Creating Objects
      let hero1 = new Superhero(
        "Star Guardian",
        "Light energy",
        "Protect the city from darkness."
      );

      let hero2 = new Superhero(
        "Aqua Queen",
        "Water control",
        "Keep oceans clean and protect sea life."
      );

      let hero3 = new Superhero(
        "Shadow Spark",
        "Invisible movement",
        "Help people and solve mysterious problems."
      );

      let hero4 = new Superhero(
        "Sky Rider",
        "Flying power",
        "Rescue people and protect the sky."
      );

      document.getElementById("heroCards").innerHTML =
        hero1.describeHero() +
        hero2.describeHero() +
        hero3.describeHero() +
        hero4.describeHero();
    }
  </script>

</body>
</html>
